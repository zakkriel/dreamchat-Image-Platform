services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: image_platform
      POSTGRES_PASSWORD: image_platform
      POSTGRES_DB: image_platform
    ports:
      # Host 5433, not 5432: the sibling dreamchat-world-backend stack owns host
      # 5432 in the shared dev environment, and both stacks must be able to run
      # at the same time. The in-container port stays 5432, so every
      # service-to-service DSN below still targets `postgres:5432`.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U image_platform -d image_platform"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/image-platform &&
      mc anonymous set download local/image-platform &&
      echo 'bucket ready'
      "
    restart: "no"

  image-platform-api:
    build:
      context: .
      args:
        BINARY: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_PORT: "8080"
      ENVIRONMENT: dev
      LOG_LEVEL: info
      WORKER_CONCURRENCY: "4"
      POSTGRES_DSN: postgres://image_platform:image_platform@postgres:5432/image_platform?sslmode=disable
      POSTGRES_SYSTEM_DSN: postgres://image_platform:image_platform@postgres:5432/image_platform?sslmode=disable
      REDIS_ADDR: redis:6379
      S3_BUCKET: image-platform
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      # Presigned read URLs are signed for this origin instead of S3_ENDPOINT:
      # the containers reach MinIO at `minio:9000` (a Docker network name the
      # browser cannot resolve), while the host publishes it on localhost:9000.
      # SigV4 signs the Host header, so the URL must be signed for the host the
      # client will call — it cannot be rewritten after signing.
      # Delivery origin — fetched by the CALLER (browser / world backend), so it
      # stays localhost. Do NOT point this at a tunnel: when the tunnel dies,
      # every already-delivered image 404s.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      # Reference origin — fetched by the PROVIDER's own servers (fal downloads
      # image_urls itself), so this is the one that needs a public tunnel URL.
      # Empty falls back to S3_PUBLIC_ENDPOINT. See
      # docs/runbooks/local-development.md.
      S3_REFERENCE_ENDPOINT: ${S3_REFERENCE_ENDPOINT:-}
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_USE_PATH_STYLE: "true"
      IMAGE_PROVIDER: mock
      # Real provider keys come from the HOST environment (shell export or the
      # gitignored ./.env, which compose interpolates) — never hardcoded here.
      # Empty means the provider is not registered and its routes stay
      # unselectable, which is the default local setup.
      BFL_API_KEY: ${BFL_API_KEY:-}
      FAL_KEY: ${FAL_KEY:-}
      # Local dev only. Mock is a SYNTHETIC provider, so by default it may not
      # satisfy identity-axis routes (identity/pack/production) and every
      # character/place pack request fails closed with 422 (PRD 03 §8). This
      # stack has no real provider key by default, so it is enabled here to
      # exercise pack generation with mock placeholders. Overridable from the
      # host so a real-provider run can turn it off without editing this file;
      # real deployments (deploy/railway) MUST leave it unset.
      ALLOW_SYNTHETIC_PROVIDERS: ${ALLOW_SYNTHETIC_PROVIDERS:-true}
      API_TOKEN_PEPPER: dev-pepper-change-me
      OPENAPI_DOCS_ENABLED: "true"
      # Governance (ADR-P002). Enforcement stays log_only by default, but the
      # authorized-issuer allowlist must still be populated: an issuer absent from
      # it is recorded as media.eligibility_blocked/unknown_issuer while the
      # request is ALLOWED through, so an empty allowlist looks healthy (202s) and
      # then fails every request the day GOVERNANCE_ENFORCEMENT flips to enforce.
      # svc_world_backend is the sibling dreamchat-world-backend service identity.
      # API only — the worker never verifies envelopes (the gate runs in the
      # handler), so setting it there would imply a check that does not happen.
      GOVERNANCE_ENFORCEMENT: ${GOVERNANCE_ENFORCEMENT:-log_only}
      GOVERNANCE_AUTHORIZED_ISSUERS: ${GOVERNANCE_AUTHORIZED_ISSUERS:-svc_world_backend}
    ports:
      # Host 8081, not 8080: the sibling dreamchat-world-backend `core/api`
      # owns host 8080 in the shared dev environment, and both stacks must be
      # able to run at the same time. The in-container port stays 8080, so
      # APP_PORT, the healthcheck, and every service-to-service URL are
      # unchanged.
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 3s
      timeout: 5s
      retries: 20

  image-platform-worker:
    build:
      context: .
      args:
        BINARY: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ENVIRONMENT: dev
      LOG_LEVEL: info
      WORKER_CONCURRENCY: "4"
      POSTGRES_DSN: postgres://image_platform:image_platform@postgres:5432/image_platform?sslmode=disable
      POSTGRES_SYSTEM_DSN: postgres://image_platform:image_platform@postgres:5432/image_platform?sslmode=disable
      REDIS_ADDR: redis:6379
      S3_BUCKET: image-platform
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      # Delivery origin (see the API service) — caller-facing, stays localhost.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      # The worker is the process that presigns REFERENCE image URLs for a
      # reference-conditioned provider, so THIS is the value that must be
      # publicly fetchable whenever fal is used — and must match the API's.
      S3_REFERENCE_ENDPOINT: ${S3_REFERENCE_ENDPOINT:-}
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_USE_PATH_STYLE: "true"
      IMAGE_PROVIDER: mock
      # Same host-supplied keys as the API. The worker is the process that
      # actually calls the provider, so a key set only on the API resolves a
      # route the worker then cannot execute.
      BFL_API_KEY: ${BFL_API_KEY:-}
      FAL_KEY: ${FAL_KEY:-}
      # See the API service: mock may satisfy identity/pack routes in this local
      # stack only. Must match the API's value or the worker and the resolver
      # disagree about which routes are servable.
      ALLOW_SYNTHETIC_PROVIDERS: ${ALLOW_SYNTHETIC_PROVIDERS:-true}
      API_TOKEN_PEPPER: dev-pepper-change-me
      OPENAPI_DOCS_ENABLED: "true"

volumes:
  postgres_data:
  redis_data:
  minio_data:
